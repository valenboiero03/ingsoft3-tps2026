server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3000;

    location /api/ {
        proxy_pass $backend_api;
    }
}