name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Minimo privilegio: solo este job puede escribir paquetes (publicar la imagen).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered} de \${t[m].total} |\`;
            console.log('### Coverage del backend');
            console.log('| metrica | % | cubierto |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Desde aca, nada lleva !cancelled(): si los tests fallaron el job ya murio
      # y estos dos pasos nunca corren. La condicion esta en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ULTIMO paso del job: la imagen sale solo si todo lo anterior paso.
      # En un PR se construye igual (verifica que compila) pero no se sube.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Minimo privilegio: solo este job puede escribir paquetes (publicar la imagen).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered} de \${t[m].total} |\`;
            console.log('### Coverage del frontend');
            console.log('| metrica | % | cubierto |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Desde aca, nada lleva !cancelled(): si los tests fallaron el job ya murio
      # y estos dos pasos nunca corren. La condicion esta en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ULTIMO paso del job: la imagen sale solo si todo lo anterior paso.
      # En un PR se construye igual (verifica que compila) pero no se sube.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    # Minimo privilegio (TP9, hallazgo de CodeQL): este job solo baja el codigo
    # o llama a Render con sus propios secrets; el token de GitHub no escribe nada.
    permissions:
      contents: read
    needs: [build-backend, build-frontend]   # sin CI verde no hay imagen, y sin imagen no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; solo main despliega
    environment: qa                          # hereda los secrets del environment qa
    steps:
      # El hook ya no dice QUE COMMIT construir: dice QUE IMAGEN ejecutar.
      # Render no compila nada: baja de ghcr.io la imagen que publico ESTA corrida.
      # imgURL va como un parametro mas de la URL del hook (que ya trae ?key=...):
      # --get --data-urlencode lo agrega con & y le codifica los : y / de la imagen.
      # La URL del hook va ULTIMA: es el unico argumento suelto del curl.
      # Si la etiqueta no existe, o el nombre no es el configurado en el servicio,
      # Render contesta 400 y el -f pone la corrida en rojo.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo
          echo "QA api   -> $IMG_API"
          echo "QA front -> $IMG_FRONT"

      # Reintenta 30 veces cada 20 s: el plan Free duerme los servicios y bajar
      # la imagen + cold start tarda. Chequea cuatro cosas:
      #   /health              -> el proceso del backend esta vivo
      #   /api/servicios       -> el backend llega a SU base (Neon app_qa)
      #   front /              -> nginx sirve la app
      #   front /api/servicios -> el front llega a SU backend (BACKEND_URL)
      - name: Smoke test de QA (espera a que conteste)
        shell: bash
        env:
          URL_API: https://turnero-api-qa-i3gd.onrender.com
          URL_FRONT: https://turnero-front-qa-crex.onrender.com
        run: |
          echo "Esperando a que QA este vivo..."
          for i in $(seq 1 30); do
            # --max-time: un servicio despertando acepta la conexion y no
            # contesta; sin tope, curl podria colgarse en cada vuelta.
            # /health tiene que contestar con ESTE commit, y en un servicio de
            # imagen ese dato solo puede venir de la imagen (GIT_COMMIT horneado):
            # si contesta otro, la api todavia no ejecuta la imagen de esta corrida.
            if curl -fsS --max-time 10 "$URL_API/health" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/servicios" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/servicios" > /dev/null; then
              echo ""
              echo "QA responde con $GITHUB_SHA (api + base + front + front->api), vuelta $i"
              exit 0
            fi
            echo " ... vuelta $i: todavia no responde con $GITHUB_SHA"
            sleep 20
          done
          echo "QA no respondio a tiempo"
          exit 1

  # Escalon del medio: pedidos HTTP directo a la api de QA (sin navegador y sin
  # dobles), con la base de verdad detras. Corre apenas QA ejecuta la imagen de
  # ESTA corrida, y antes que las e2e: si la api esta rota, no se gasta un
  # navegador en confirmarlo.
  integracion:
    runs-on: ubuntu-latest
    # Minimo privilegio (TP9, hallazgo de CodeQL): este job solo baja el codigo
    # o llama a Render con sus propios secrets; el token de GitHub no escribe nada.
    permissions:
      contents: read
    needs: deploy-qa                         # QA ya esta ejecutando la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Sin `playwright install`: estas pruebas no abren navegador.
      - name: Instalar dependencias (sin navegador)
        run: npm ci
        working-directory: ./frontend

      - name: Integracion contra la api de QA
        env:
          API_BASE_URL: https://turnero-api-qa-i3gd.onrender.com   # la API de QA, no el front
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      # El reporte importa MAS cuando falla. Nombre distinto del de e2e.
      - name: Publicar reporte de integracion
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  # La punta de la piramide: un navegador de verdad contra el front de QA, que
  # le habla a su api y a su base. Es el gate: sin e2e verde, PROD ni pide
  # aprobacion.
  e2e:
    runs-on: ubuntu-latest
    # Minimo privilegio (TP9, hallazgo de CodeQL): este job solo baja el codigo
    # o llama a Render con sus propios secrets; el token de GitHub no escribe nada.
    permissions:
      contents: read
    needs: integracion                       # si la api esta rota, no gastamos un navegador
    timeout-minutes: 20                      # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias + navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: https://turnero-front-qa-crex.onrender.com   # el FRONT de QA
        run: npx playwright test e2e/turnos.spec.js   # SU archivo: sin esto vuelve a correr la integracion
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    # Minimo privilegio (TP9, hallazgo de CodeQL): este job solo baja el codigo
    # o llama a Render con sus propios secrets; el token de GitHub no escribe nada.
    permissions:
      contents: read
    needs: e2e                               # EL gate: sin e2e verde, ni siquiera se pide aprobacion
    # Sin if de rama: la cadena arranca en deploy-qa, que ya lo tiene. En un PR
    # deploy-qa no corre, y por eso tampoco integracion, e2e ni este.
    environment: production                  # aca la corrida se PAUSA hasta que el reviewer aprueba
    # Un solo deploy a PROD a la vez. No ordena la cola de aprobaciones: si
    # quedan dos corridas esperando, la vieja se rechaza a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Entre que la corrida queda esperando y alguien aprueba pueden pasar horas
      # y main se mueve. El imgURL con el sha de ESTA corrida garantiza que a PROD
      # llega la MISMA imagen que se verifico en QA: ni la punta de la rama ni
      # una reconstruccion.
      - name: Desplegar en PROD la MISMA imagen que verifico QA (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo
          echo "PROD api   -> $IMG_API"
          echo "PROD front -> $IMG_FRONT"

      - name: Smoke test de PROD (espera a que conteste)
        shell: bash
        env:
          URL_API: https://turnero-api-prod-am2s.onrender.com
          URL_FRONT: https://turnero-front-prod-y4rx.onrender.com
        run: |
          echo "Esperando a que PROD este vivo..."
          for i in $(seq 1 30); do
            # /health tiene que contestar con ESTE commit: en un servicio de imagen
            # solo puede venir de la imagen horneada. Si contesta otro, PROD todavia
            # no ejecuta la imagen de esta corrida.
            if curl -fsS --max-time 10 "$URL_API/health" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/servicios" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/servicios" > /dev/null; then
              echo ""
              echo "PROD responde con $GITHUB_SHA (api + base + front + front->api), vuelta $i"
              exit 0
            fi
            echo " ... vuelta $i: todavia no responde con $GITHUB_SHA"
            sleep 20
          done
          echo "PROD no respondio a tiempo"
          exit 1
