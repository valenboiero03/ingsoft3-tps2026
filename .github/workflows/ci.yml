name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Minimo privilegio: solo este job puede escribir paquetes (publicar la imagen).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered} de \${t[m].total} |\`;
            console.log('### Coverage del backend');
            console.log('| metrica | % | cubierto |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Desde aca, nada lleva !cancelled(): si los tests fallaron el job ya murio
      # y estos dos pasos nunca corren. La condicion esta en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ULTIMO paso del job: la imagen sale solo si todo lo anterior paso.
      # En un PR se construye igual (verifica que compila) pero no se sube.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Minimo privilegio: solo este job puede escribir paquetes (publicar la imagen).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered} de \${t[m].total} |\`;
            console.log('### Coverage del frontend');
            console.log('| metrica | % | cubierto |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Desde aca, nada lleva !cancelled(): si los tests fallaron el job ya murio
      # y estos dos pasos nunca corren. La condicion esta en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ULTIMO paso del job: la imagen sale solo si todo lo anterior paso.
      # En un PR se construye igual (verifica que compila) pero no se sube.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; solo main despliega
    environment: qa                          # hereda los secrets del environment qa
    steps:
      # El &ref= es el corazon del job: un hook pelado despliega la PUNTA de main,
      # no el commit que este pipeline acaba de verificar. Con dos merges
      # seguidos, la corrida del primero desplegaria el segundo.
      # Va con & y no con ? porque la URL del hook ya trae ?key=...
      # Ojo: Render RECONSTRUYE ese commit (no usa la imagen de ghcr.io). Es la
      # limitacion del TP6 que el TP7 viene a cerrar.
      - name: Disparar deploy en Render (backend + front) del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA" > /dev/null
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA" > /dev/null
          echo "Deploy de $GITHUB_SHA pedido a Render (api + front de QA)"

      # Reintenta 30 veces cada 20 s: el plan Free duerme los servicios y el
      # build + cold start tarda minutos. Chequea cuatro cosas:
      #   /health              -> el proceso del backend esta vivo
      #   /api/servicios       -> el backend llega a SU base (Neon app_qa)
      #   front /              -> nginx sirve la app
      #   front /api/servicios -> el front llega a SU backend (BACKEND_URL)
      - name: Smoke test de QA (espera a que conteste)
        shell: bash
        env:
          URL_API: https://turnero-api-qa-i3gd.onrender.com
          URL_FRONT: https://turnero-front-qa-crex.onrender.com
        run: |
          echo "Esperando a que QA este vivo..."
          for i in $(seq 1 30); do
            # --max-time: un servicio despertando acepta la conexion y no
            # contesta; sin tope, curl podria colgarse en cada vuelta.
            # /health tiene que contestar con ESTE commit: si contesta otro, Render
            # todavia esta construyendo o sirviendo la version anterior.
            if curl -fsS --max-time 10 "$URL_API/health" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/servicios" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/servicios" > /dev/null; then
              echo ""
              echo "QA responde con $GITHUB_SHA (api + base + front + front->api), vuelta $i"
              exit 0
            fi
            echo " ... vuelta $i: todavia no responde con $GITHUB_SHA"
            sleep 20
          done
          echo "QA no respondio a tiempo"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa                         # PROD solo despues de QA vivo
    # Sin if de rama: depende de deploy-qa, que ya lo tiene. En un PR deploy-qa
    # no corre, asi que este tampoco. La condicion se hereda por la cadena.
    environment: production                  # aca la corrida se PAUSA hasta que el reviewer aprueba
    # Un solo deploy a PROD a la vez. No ordena la cola de aprobaciones: si
    # quedan dos corridas esperando, la vieja se rechaza a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Entre que la corrida queda esperando y alguien aprueba pueden pasar horas
      # y main se mueve. El &ref= garantiza que a PROD llega el commit que se
      # aprobo, no la punta de la rama.
      - name: Disparar deploy en Render (backend + front) del commit aprobado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA" > /dev/null
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA" > /dev/null
          echo "Deploy de $GITHUB_SHA pedido a Render (api + front de PROD)"

      - name: Smoke test de PROD (espera a que conteste)
        shell: bash
        env:
          URL_API: https://turnero-api-prod-am2s.onrender.com
          URL_FRONT: https://turnero-front-prod-y4rx.onrender.com
        run: |
          echo "Esperando a que PROD este vivo..."
          for i in $(seq 1 30); do
            # /health tiene que contestar con ESTE commit: si contesta otro, Render
            # todavia esta construyendo o sirviendo la version anterior.
            if curl -fsS --max-time 10 "$URL_API/health" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/servicios" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/servicios" > /dev/null; then
              echo ""
              echo "PROD responde con $GITHUB_SHA (api + base + front + front->api), vuelta $i"
              exit 0
            fi
            echo " ... vuelta $i: todavia no responde con $GITHUB_SHA"
            sleep 20
          done
          echo "PROD no respondio a tiempo"
          exit 1
